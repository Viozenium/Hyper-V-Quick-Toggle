[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "HyperV-Quick-Toggle"
version = "1.3.0"
description = "GUI per abilitare/disabilitare Hyper-V su Windows"
authors = [
    { name = "Mizu" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Topic :: System :: Systems Administration"
]

[project.scripts]
hyperv-toggle = "hyperv_toggle.__main__:main"

[tool.setuptools]
packages = ["hyperv_toggle"]

[tool.pytest.ini_options]
testpaths = ["tests"]